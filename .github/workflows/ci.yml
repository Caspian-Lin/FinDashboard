name: CI
on:
  push:
    branches: [main, dev, "m/**"]
  pull_request:
    branches: [main, dev, "m/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: lint + typecheck + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finboard
          POSTGRES_PASSWORD: finboard
          POSTGRES_DB: finboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FINBOARD_ENV: ci
      FINBOARD_DB_URL: postgresql+psycopg://finboard:finboard@127.0.0.1:5432/finboard
      FINBOARD_BROKER: mock

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Typecheck (mypy)
        run: uv run mypy .

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Test (pytest)
        run: uv run pytest -m "not slow"

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            .coverage
            htmlcov/
          retention-days: 7
