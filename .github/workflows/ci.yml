name: CI
on:
  push:
    branches: [main, dev, "m/**"]
  pull_request:
    branches: [main, dev, "m/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: lint + typecheck + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: findashboard
          POSTGRES_PASSWORD: findashboard
          POSTGRES_DB: findashboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U findashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FINBOARD_ENV: ci
      FINBOARD_DB_URL: postgresql+psycopg://findashboard:findashboard@127.0.0.1:5432/findashboard
      # issue #167:集成测试跑在独立测试库(conftest 自动 CREATE DATABASE,
      # postgres 服务用户是 superuser);alembic 迁移仍走 FINBOARD_DB_URL。
      FINBOARD_TEST_DB_URL: postgresql+psycopg://findashboard:findashboard@127.0.0.1:5432/findashboard_test
      FINBOARD_BROKER: mock
      # 强制 uv 使用 actions/setup-python 提供的解释器,避免 uv python install
      # 去外部 python-build-standalone 源下载(该源偶发 404/超时导致 CI 卡在 setup)
      UV_PYTHON_PREFERENCE: only-system

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Typecheck (mypy)
        run: uv run mypy .

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Test (pytest)
        run: uv run pytest -m "not slow"

      - name: Hang-guard probes (issue #167)
        # 挂死探针验收:sync 进程级兜底 + async 优雅失败,~10s 内结束。
        # 任一守卫失效(探针 XPASS 或进程挂死)该步骤失败。
        run: uv run pytest tests/unit/test_hang_guard.py -m hang_guard

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            .coverage
            htmlcov/
          retention-days: 7
