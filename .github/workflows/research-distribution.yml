name: Docker research edition

on:
  pull_request:
    branches: [dev, main, "m/**", "feat/docker-research-547"]
    paths:
      - docker/research/**
      - desktop/**
      - scripts/*research*.py
      - scripts/*research*.ps1
      - packages/**
      - migrations/**
      - web/**
      - uv.lock
      - .github/workflows/research-distribution.yml
  push:
    tags: ["research-v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FINBOARD_IMAGE: finboard-research:local
      FINBOARD_DB_SECRET_FILE: ${{ github.workspace }}/.tmp/postgres-password
      FINBOARD_PORT: 18176
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/research/Dockerfile
          platforms: linux/amd64
          tags: finboard-research:local
          load: true
          cache-from: type=gha,scope=research-distribution
          cache-to: type=gha,scope=research-distribution,mode=max
      - name: Build the separate deterministic starter bundle offline
        run: |
          mkdir -p .tmp
          openssl rand -hex 32 > "$FINBOARD_DB_SECRET_FILE"
          docker run --rm --network none --entrypoint python \
            --user "$(id -u):$(id -g)" -v "$PWD:/src" finboard-research:local \
            /src/scripts/build_research_starter.py /src/.tmp/synthetic-starter-v1.zip
      - name: Migrate an empty database and run the offline starter study
        run: |
          set -euo pipefail
          PG_IMAGE=$(python -c 'from scripts.package_research_desktop import POSTGRES_IMAGE; print(POSTGRES_IMAGE)')
          docker pull --platform linux/amd64 "$PG_IMAGE"
          docker image tag "$PG_IMAGE" postgres:16-alpine
          FINBOARD_SMOKE_OFFLINE=1 python scripts/smoke_research_distribution.py .tmp/synthetic-starter-v1.zip | tee .tmp/research-smoke.json
      - name: Print diagnostics
        if: failure()
        run: docker compose -f docker/research/compose.yaml logs --tail=80
      - uses: actions/upload-artifact@v4
        with:
          name: research-edition-evidence
          include-hidden-files: true
          path: |
            .tmp/synthetic-starter-v1.zip
            .tmp/research-smoke.json
      - name: Prepare the actual offline resources for desktop PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feat/research-desktop-')
        run: |
          set -euo pipefail
          PG_IMAGE=$(python -c 'from scripts.package_research_desktop import POSTGRES_IMAGE; print(POSTGRES_IMAGE)')
          VERSION=$(python - <<'PY'
          import os
          run = int(os.environ["GITHUB_RUN_NUMBER"]) - 1
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"]) - 1
          if not (0 <= run < 65536 and 0 <= attempt < 256):
              raise ValueError("GitHub run and attempt must fit the MSI preview version")
          minor, patch = divmod(run, 256)
          print(f"250.{minor}.{patch * 256 + attempt}")
          PY
          )
          python scripts/package_research_desktop.py desktop/src-tauri/resources/edition \
            --config desktop/src-tauri/tauri.offline.conf.json --starter .tmp/synthetic-starter-v1.zip \
            --app-image "$FINBOARD_IMAGE" --postgres-image "$PG_IMAGE" --version "$VERSION" --preview
          docker image load --input desktop/src-tauri/resources/edition/images.tar
          python -c 'from pathlib import Path; from scripts.package_research_desktop import verify_loaded_images; verify_loaded_images(Path("desktop/src-tauri/resources/edition/offline-manifest.json"))'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feat/research-desktop-')
        with:
          name: offline-desktop-pr-assets
          path: |
            desktop/src-tauri/resources/edition
            desktop/src-tauri/tauri.offline.conf.json
          compression-level: 0
          retention-days: 3

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows installer failure recovery
        shell: powershell
        run: ./scripts/test_research_installer.ps1

  desktop-check:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      FINBOARD_DESKTOP_PR_BUILD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feat/research-desktop-') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify the bounded host operations and WebView origins
        working-directory: desktop/src-tauri
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Check the management UI script
        run: node --check desktop/ui/app.js
      - name: Exercise the Windows desktop installer and recovery paths
        shell: powershell
        run: ./scripts/test_research_desktop_host.ps1
      - uses: actions/download-artifact@v4
        if: env.FINBOARD_DESKTOP_PR_BUILD == 'true'
        with:
          name: offline-desktop-pr-assets
          path: desktop/src-tauri
      - name: Validate WiX packaging
        working-directory: desktop
        run: |
          $hasPayload = $env:FINBOARD_DESKTOP_PR_BUILD -eq 'true'
          if ($hasPayload) {
            $edition = 'src-tauri/resources/edition'
            foreach ($file in @('offline-manifest.json','images.tar','starter.zip','image.txt','finboard.ps1','finboard.cmd','desktop-host.ps1','installer-clients.ps1','mcp-bridge.ps1','compose.yaml','compose.desktop.yaml','finboard-research/SKILL.md')) {
              if (!(Test-Path -LiteralPath (Join-Path $edition $file) -PathType Leaf)) {
                throw "The offline preview resource $file is missing."
              }
            }
            $manifest = Get-Content -LiteralPath (Join-Path $edition 'offline-manifest.json') -Raw | ConvertFrom-Json
            $archive = Get-FileHash -LiteralPath (Join-Path $edition 'images.tar') -Algorithm SHA256
            if ($manifest.channel -cne 'preview' -or $archive.Hash.ToLowerInvariant() -cne $manifest.archive_sha256) {
              throw 'The offline preview manifest or image checksum does not match.'
            }
          }
          if (!$hasPayload) {
            New-Item -ItemType Directory src-tauri/resources/edition -Force | Out-Null
            Copy-Item ../docker/research/finboard.ps1 src-tauri/resources/edition/finboard.ps1
            '{"bundle":{"resources":{"resources/edition":"edition/"}}}' |
              Set-Content -Encoding ascii src-tauri/tauri.offline.conf.json
          }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($hasPayload) {
            $profile = 'release'
            npm run build -- --ci -- --locked
          } else {
            $profile = 'debug'
            npm run build -- --debug --ci -- --locked
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/$profile/bundle/msi/*.msi)
          if ($msi.Count -ne 1) { throw 'Expected one x64 MSI.' }
          if ($hasPayload) {
            $out = 'FinDashboard-research-offline-windows-amd64-pr.msi'
            Copy-Item -LiteralPath $msi[0].FullName -Destination $out
            $sha = (Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sha  $out" | Set-Content -Encoding ascii SHA256SUMS-desktop-pr
          }
      - uses: actions/upload-artifact@v4
        if: env.FINBOARD_DESKTOP_PR_BUILD == 'true'
        with:
          name: research-desktop-pr-msi
          path: |
            desktop/FinDashboard-research-offline-windows-amd64-pr.msi
            desktop/SHA256SUMS-desktop-pr
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/research-v')
    needs: [verify, windows-installer, desktop-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.desktop-image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: research-edition-evidence
          path: dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        shell: bash
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}-research" >> "$GITHUB_OUTPUT"
      - name: Publish the versioned research image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/research/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.ref }}:${{ github.ref_name }}
          push: true
          provenance: false
          cache-from: type=gha,scope=research-distribution
      - name: Record the research image identity
        id: desktop-image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
        run: echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Publish the optional sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/research-sandbox/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.ref }}-sandbox:${{ github.ref_name }}
          push: true
          provenance: false
      - name: Package the installer and attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
          SANDBOX_IMAGE: ${{ steps.image.outputs.ref }}-sandbox:${{ github.ref_name }}
        run: |
          python scripts/package_research_edition.py dist/FinDashboard-research-windows-amd64.zip "$IMAGE"
          python scripts/measure_research_images.py "$IMAGE" postgres:16-alpine --max-mib 384 > dist/research-image-sizes.json
          python scripts/measure_research_images.py "$SANDBOX_IMAGE" > dist/sandbox-image-size.json
          test "$(wc -c < dist/FinDashboard-research-windows-amd64.zip)" -le 262144
          test "$(wc -c < dist/synthetic-starter-v1.zip)" -le 262144
          cd dist
          sha256sum FinDashboard-research-windows-amd64.zip synthetic-starter-v1.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "FinDashboard Research $GITHUB_REF_NAME" \
            --notes-file ../docs/research-edition.md \
            FinDashboard-research-windows-amd64.zip synthetic-starter-v1.zip SHA256SUMS research-smoke.json research-image-sizes.json sandbox-image-size.json

  desktop-offline-assets:
    if: startsWith(github.ref, 'refs/tags/research-v')
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: research-edition-evidence
          path: dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bundle and check both offline image identities
        env:
          IMAGE: ${{ needs.release.outputs.image }}
        run: |
          set -euo pipefail
          PG_IMAGE=$(python -c 'from scripts.package_research_desktop import POSTGRES_IMAGE; print(POSTGRES_IMAGE)')
          VERSION=${GITHUB_REF_NAME#research-v}
          docker pull --platform linux/amd64 "$IMAGE"
          docker pull --platform linux/amd64 "$PG_IMAGE"
          python scripts/package_research_desktop.py desktop/src-tauri/resources/edition \
            --config desktop/src-tauri/tauri.offline.conf.json --starter dist/synthetic-starter-v1.zip \
            --app-image "$IMAGE" --postgres-image "$PG_IMAGE" --version "$VERSION"
          docker image load --input desktop/src-tauri/resources/edition/images.tar
          python -c 'from pathlib import Path; from scripts.package_research_desktop import verify_loaded_images; verify_loaded_images(Path("desktop/src-tauri/resources/edition/offline-manifest.json"))'
      - uses: actions/upload-artifact@v4
        with:
          name: offline-desktop-assets
          path: |
            desktop/src-tauri/resources/edition
            desktop/src-tauri/tauri.offline.conf.json
          compression-level: 0
          retention-days: 3

  desktop-msi:
    if: startsWith(github.ref, 'refs/tags/research-v')
    needs: desktop-offline-assets
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: offline-desktop-assets
          path: desktop/src-tauri
      - name: Build the Windows x64 MSI
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build -- --ci -- --locked
      - name: Attach offline MSI and checksum to the draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundle = Get-ChildItem desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if (@($bundle).Count -ne 1) { throw 'Expected one x64 MSI.' }
          $name = 'FinDashboard-research-offline-windows-amd64.msi'
          Copy-Item -LiteralPath $bundle.FullName -Destination $name
          $sha = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $name" | Set-Content -Encoding ascii SHA256SUMS-desktop
          @{
            windows_msi_bytes = (Get-Item -LiteralPath $name).Length
            archive_bytes = (Get-Item -LiteralPath 'desktop/src-tauri/resources/edition/images.tar').Length
            sha256 = $sha
          } | ConvertTo-Json | Set-Content -Encoding ascii desktop-size.json
          gh release upload "$env:GITHUB_REF_NAME" $name SHA256SUMS-desktop desktop-size.json
