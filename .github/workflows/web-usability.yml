name: Web usability
on:
  pull_request:
    branches: [main, dev, "m/**"]
    paths: ["web/**", ".github/workflows/web-usability.yml"]
  push:
    branches: [main, dev, "m/**"]
    paths: ["web/**", ".github/workflows/web-usability.yml"]
  workflow_dispatch:

concurrency:
  group: web-usability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm exec playwright -- install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-usability-browser-results
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
