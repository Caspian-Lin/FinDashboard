[project]
name = "finboard-persistence"
version = "0.1.0"
description = "SQLAlchemy 2.0 ORM 模型 + Repository + Alembic 迁移。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "finboard-data",
  "finboard-shared",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_persistence"]
