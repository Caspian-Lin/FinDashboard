[project]
name = "finboard-backtest"
version = "0.1.0"
description = "回测引擎 — 行情回放 + 纸面撮合 + 绩效分析。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "finboard-shared",
  "finboard-core",
  "finboard-broker",
  "finboard-data",
  "pydantic>=2.9",
  "structlog>=24.1",
  "numpy>=2.5.3",
  "threadpoolctl>=3.5",
  "pyarrow>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_backtest"]
