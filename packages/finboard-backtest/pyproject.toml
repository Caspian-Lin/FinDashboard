[project]
name = "finboard-backtest"
version = "0.1.0"
description = "回测引擎 — 行情回放 + 纸面撮合 + 绩效分析。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "finboard-shared",
  "finboard-core",
  "finboard-broker",
  "finboard-data",
  "structlog>=24.1",
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_backtest"]
