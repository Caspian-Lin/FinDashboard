[project]
name = "finboard-broker"
version = "0.1.0"
description = "BrokerAdapter 抽象接口 + Mock 实现。QMT/CTP 实现见同 monorepo 内独立包。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["finboard-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_broker"]
