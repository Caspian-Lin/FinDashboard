[project]
name = "finboard-shared"
version = "0.1.0"
description = "Cross-module domain types: enums, identifiers, dataclasses, exceptions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "threadpoolctl>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_shared"]
