[project]
name = "finboard-simulation"
version = "0.1.0"
description = "与实盘后端硬隔离的持久化模拟交易环境。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "finboard-shared",
  "finboard-persistence",
  "finboard-backtest",
  "sqlalchemy>=2.0",
  "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_simulation"]
