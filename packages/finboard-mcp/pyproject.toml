[project]
name = "finboard-mcp"
version = "0.1.0"
description = "FinBoard MCP Server — 向外置 Agent(OpenCode)暴露受控研究工具的 MCP 服务。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "finboard-shared",
  "finboard-app",
  "finboard-backtest",
  "finboard-persistence",
  "mcp>=2.0",
  "httpx>=0.27",
  "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_mcp"]
