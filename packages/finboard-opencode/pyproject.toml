[project]
name = "finboard-opencode"
version = "0.1.0"
description = "OpenCode 研究运行时集成 —— 会话关联、SSE 事件订阅、中断恢复与持久化。"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "finboard-shared",
  "finboard-persistence",
  "httpx>=0.27",
  "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_opencode"]
