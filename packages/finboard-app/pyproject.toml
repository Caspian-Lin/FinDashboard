[project]
name = "finboard-app"
version = "0.1.0"
description = "进程入口 / CLI / 配置 / 依赖注入组装根。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "finboard-shared",
  "finboard-broker",
  "finboard-persistence",
  "finboard-core",
  "finboard-risk",
  "finboard-reconcile",
  "finboard-scheduler",
  "finboard-data",
  "finboard-backtest",
  "structlog>=24.1",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.scripts]
finboard = "finboard_app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_app"]
