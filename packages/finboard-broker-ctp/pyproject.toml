[project]
name = "finboard-broker-ctp"
version = "0.1.0"
description = "CTP (期货) broker adapter — 当前为 stub,P1 阶段填充。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["finboard-shared", "finboard-broker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_broker_ctp"]
