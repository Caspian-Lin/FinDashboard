[project]
name = "finboard-risk"
version = "0.1.0"
description = "下单前风控 + Kill Switch,实现 finboard-core 的 RiskChecker Protocol。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["finboard-shared", "structlog>=24.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_risk"]
