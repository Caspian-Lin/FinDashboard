[project]
name = "finboard-reconcile"
version = "0.1.0"
description = "本地 ↔ 券商核对引擎(订单 / 持仓 / 资金)。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "finboard-shared",
  "finboard-broker",
  "finboard-persistence",
  "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_reconcile"]
