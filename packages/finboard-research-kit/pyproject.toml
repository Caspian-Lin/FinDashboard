[project]
name = "finboard-research-kit"
version = "0.1.0"
description = "研究代码沙箱工具包 —— 因子执行协议 v1(FactorContext / FactorResult / harness)。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "polars>=1.0",
  "pyarrow>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_research_kit"]
