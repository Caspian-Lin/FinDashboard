[project]
name = "finboard-core"
version = "0.1.0"
description = "交易内核:EventBus / 订单状态机 / OrderManager / PositionManager / AccountManager。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "finboard-shared",
  "finboard-broker",
  "finboard-persistence",
  "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboard_core"]
