[package]
name = "finboard-research-desktop"
version = "0.1.0"
edition = "2021"

[features]
standalone = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
