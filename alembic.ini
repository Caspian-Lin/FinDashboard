# Alembic 配置。
# 注意:sqlalchemy.url 在 migrations/env.py 中会被 FINBOARD_DB_URL 环境变量覆盖,
#       这里仅作为 fallback 占位。

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+psycopg://findashboard:CHANGE_ME@127.0.0.1:5432/findashboard


[post_write_hooks]
# 让 alembic 自动生成的迁移脚本经过 ruff 格式化
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
