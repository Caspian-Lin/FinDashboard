services:
  postgres:
    image: postgres:16
    container_name: findashboard-postgres
    restart: unless-stopped
    environment:
      # 开发期默认密码;本机已部署 postgres 时不必使用此 compose
      POSTGRES_USER: findashboard
      POSTGRES_PASSWORD: findashboard
      POSTGRES_DB: findashboard
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findashboard -d findashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
