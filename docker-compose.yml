services:
  postgres:
    image: postgres:16
    container_name: finboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finboard
      POSTGRES_PASSWORD: finboard
      POSTGRES_DB: finboard
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finboard -d finboard"]
      interval: 5s
      timeout: 5s
      retries: 10
