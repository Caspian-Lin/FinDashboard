<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinDashboard</title>
    <style>
      html { background-color: #020303; }
      html.light { background-color: #ffffff; }
    </style>
    <script>
      // 首帧前恢复主题 class,避免浅色用户先看到深色背景闪一下。
      // 与 theme-provider 共用同一个 localStorage key("findashboard-theme")。
      try {
        if (localStorage.getItem("findashboard-theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {
        /* localStorage 不可用时保持默认深色 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
