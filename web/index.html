<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinDashboard — 交易控制台</title>
    <script>
      // 首帧前恢复主题 class,避免浅色用户先看到深色背景闪一下。
      // 与 theme-provider 共用同一个 localStorage key("findashboard-theme")。
      try {
        if (localStorage.getItem("findashboard-theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {
        /* localStorage 不可用时保持默认深色 */
      }
    </script>
  </head>
  <!-- 背景走主题 token:样式表加载前回退到深色中性灰,加载后由 --background 接管 -->
  <body style="background-color: hsl(var(--background, 0 0% 8%))">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
