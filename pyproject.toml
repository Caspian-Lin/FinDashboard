[project]
name = "findashboard"
version = "0.1.0"
description = "Production-grade quantitative trading system (modular monolith)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "FinDashboard Team" }]

# 根包本身不打包发布,仅作为 workspace 元包
[tool.uv.workspace]
members = ["packages/*"]

# workspace 内部包间引用始终走本地源
[tool.uv.sources]
finboard-shared = { workspace = true }
finboard-broker = { workspace = true }
finboard-broker-qmt = { workspace = true }
finboard-broker-ctp = { workspace = true }
finboard-persistence = { workspace = true }
finboard-core = { workspace = true }
finboard-risk = { workspace = true }
finboard-reconcile = { workspace = true }
finboard-app = { workspace = true }
finboard-api = { workspace = true }
finboard-scheduler = { workspace = true }
finboard-data = { workspace = true }
finboard-backtest = { workspace = true }
finboard-simulation = { workspace = true }
finboard-mcp = { workspace = true }
finboard-opencode = { workspace = true }

# 开发期统一依赖,改用 PEP 735 dependency-groups(uv 推荐写法)
[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "anyio>=4.4",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "ipython>=8.27",
  "httpx>=0.27",
  "pyarrow>=15.0",
  "pytest-timeout>=2.4.0",
]

# -----------------------------------------------------------------------------
# Ruff: lint + format
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/*/src", "tests", "migrations"]
extend-exclude = ["packages/*/src/*/py.typed"]

[tool.ruff.lint]
# 启用的检查集合:
#   E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade
#   N = naming, C4 = comprehensions, SIM = simplifications
#   TID = tidy-imports, PT = pytest-style, ASYNC = async lint, RUF = ruff 自有
select = ["E", "W", "F", "I", "B", "UP", "N", "C4", "SIM", "TID", "PT", "ASYNC", "RUF"]
ignore = [
  "E501",   # 行长由 formatter 控制
  "B008",   # FastAPI / typer 默认参数中调用函数(框架约定)
  "SIM117", # 允许多层 with 嵌套,可读性优先
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "SLF001"]
"migrations/**" = ["E402", "N999"]

[tool.ruff.lint.isort]
known-first-party = [
  "finboard_shared",
  "finboard_broker",
  "finboard_broker_qmt",
  "finboard_broker_ctp",
  "finboard_persistence",
  "finboard_core",
  "finboard_risk",
  "finboard_reconcile",
  "finboard_app",
  "finboard_api",
  "finboard_scheduler",
  "finboard_data",
  "finboard_backtest",
  "finboard_simulation",
  "finboard_mcp",
  "finboard_opencode",
]

# -----------------------------------------------------------------------------
# mypy: 严格类型检查
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
  "packages/finboard-shared/src",
  "packages/finboard-broker/src",
  "packages/finboard-broker-qmt/src",
  "packages/finboard-broker-ctp/src",
  "packages/finboard-persistence/src",
  "packages/finboard-core/src",
  "packages/finboard-risk/src",
  "packages/finboard-reconcile/src",
  "packages/finboard-app/src",
  "packages/finboard-api/src",
  "packages/finboard-scheduler/src",
  "packages/finboard-data/src",
  "packages/finboard-backtest/src",
  "packages/finboard-simulation/src",
  "packages/finboard-mcp/src",
  "packages/finboard-opencode/src",
]
exclude = ["migrations/versions/", "data_releases/"]  # data_releases 为 gitignored 本地研究数据(容器 root 写入,Windows ACL 拒绝遍历)

# 第三方券商 SDK(xtquant / CTP)没有类型存根,P1 实盘接入时按需在此添加
# xtquant 仅 Windows + miniQMT 可用,Linux CI 无法安装;mypy 忽略其缺失。
# pyarrow / akshare 缺少 py.typed,mypy 忽略其缺失。
[[tool.mypy.overrides]]
module = ["xtquant.*", "pyarrow.*", "akshare.*", "yfinance.*", "tushare.*"]
ignore_missing_imports = true

# 测试代码放宽部分严格项
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
asyncio_mode = "auto"
# module-scope async fixture(如 tests/integration 的 _engine)与 event loop
# 必须同 scope,否则 AsyncSession 内部的 asyncio.Lock 会跨 loop 报错
# "bound to a different event loop"。这里把 fixture 和测试都统一到 module scope。
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  # 挂死探针默认不跑(hang_guard marker 的验收运行见 README 测试章节)。
  "-m", "not hang_guard",
  "--cov=finboard_shared",
  "--cov=finboard_broker",
  "--cov=finboard_core",
  "--cov=finboard_risk",
  "--cov=finboard_api",
  "--cov=finboard_scheduler",
  "--cov=finboard_data",
  "--cov=finboard_backtest",
  "--cov=finboard_simulation",
  "--cov=finboard_mcp",
  "--cov=finboard_opencode",
  "--cov-report=term-missing",
]
markers = [
  "unit: 快速、无 IO 的纯单元测试",
  "integration: 需要 DB / Mock Broker 的集成测试",
  "slow: 耗时较长的测试,默认在 CI 中可选跳过",
  "hang_guard: 挂死守卫探针(预期在超时后 xfail,默认跳过;验收运行见 README)",
]

# pytest-timeout:挂死兜底(issue #167)。Windows 无 signal,thread 方式由
# watchdog 线程向主线程注入超时异常,可打断 time.sleep 等阻塞;asyncio 测试
# 的事件循环阻塞在 C 层(select/IOCP)无法被注入打断,由 tests/conftest.py 的
# asyncio.timeout 守卫兜底。单元测试经 tests/unit/conftest.py 的
# pytestmark 收紧到 60s,个别长测试用 @pytest.mark.timeout(N) 调大或
# @pytest.mark.timeout(None) 豁免。
timeout = 300
timeout_method = "thread"

[tool.coverage.run]
source = ["packages"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
